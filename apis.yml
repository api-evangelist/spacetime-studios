description: 'Spacetime Studios is an Austin, Texas mobile game developer and the creator
  of the free-to-play "Legends" series of cross-platform MMORPGs, including Arcane Legends,
  Pocket Legends, Star Legends, and Dark Legends. Founded by veteran game developers, the
  studio operates a consumer-facing community forum, an in-game item web store, and player
  support channels. It was surfaced as a portfolio company of Insight Partners and added to
  the API Evangelist network. As of this enrichment pass the studio publishes no public
  developer API, SDK, OpenAPI/AsyncAPI specification, developer portal, or /.well-known
  discovery surface; this profile captures its verified public web properties and domain
  security posture.'
